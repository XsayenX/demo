<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Asistencia - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Panameño Garcia</a>
            <a href="/" class="btn btn-outline-light btn-sm">Inicio</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h3 class="mb-0 fw-bold text-dark"><i class="bi bi-journal-check"></i> Asistencias por Trabajador</h3>
                <a th:href="@{/asistencias/registrar}" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-lg"></i> Registrar Nueva Jornada
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Trabajador</th>
                                <th>DUI</th>
                                <th>Cargo</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${trabajadores}">
                                <td class="ps-4">
                                    <i class="bi bi-person-circle text-primary me-2"></i>
                                    <span class="fw-bold" th:text="${t.nombre}"></span>
                                </td>
                                <td th:text="${t.dui}"></td>
                                <td th:text="${t.puesto}"></td>
                                <td class="text-center">
                                    <a th:href="@{/asistencias/detalle/{id}(id=${t.id})}" class="btn btn-sm btn-info text-white">
                                        <i class="bi bi-eye"></i> Ver Historial
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(trabajadores)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-info-circle display-4"></i>
                                    <p>No hay registros de asistencia para mostrar.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
