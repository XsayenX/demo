<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Asistencias')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('asistencias')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Control de Asistencias')}"></header>
        <main class="content-body">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-4 px-4 d-flex justify-content-between align-items-center border-0">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-journal-check me-2 text-primary"></i>Registros por Trabajador</h5>
                    <a th:href="@{/asistencias/registrar}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                        <i class="bi bi-plus-lg me-2"></i>Reportar Jornada
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4 py-3">Nombre Completo</th>
                                    <th>DUI</th>
                                    <th>Cargo / Puesto</th>
                                    <th class="text-center pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${trabajadores}">
                                    <td class="ps-4 py-3 fw-bold text-dark">
                                        <i class="bi bi-person-circle text-primary me-2"></i><span th:text="${t.nombre}"></span>
                                    </td>
                                    <td th:text="${t.dui}" class="font-monospace text-muted"></td>
                                    <td th:text="${t.puesto}"></td>
                                    <td class="text-center pe-4">
                                        <a th:href="@{/asistencias/detalle/{id}(id=${t.id})}" class="btn btn-sm btn-info text-white px-4 rounded-pill fw-bold shadow-sm">Ver Historial</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(trabajadores)}">
                                    <td colspan="4" class="text-center py-5 text-muted">
                                        <i class="bi bi-info-circle fs-2 d-block mb-2"></i>
                                        No se han registrado jornadas de trabajo aún.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
