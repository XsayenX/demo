<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencias - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Panameño Garcia</a>
            <a href="/" class="btn btn-outline-light btn-sm">Inicio</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${success}" class="alert alert-success shadow-sm" th:text="${success}"></div>

        <div class="card shadow border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h3 class="mb-0 fw-bold text-primary"><i class="bi bi-calendar-check"></i> Registro de Asistencias</h3>
                <a th:href="@{/asistencias/registrar}" class="btn btn-primary rounded-pill">
                    <i class="bi bi-plus-lg"></i> Reportar Día
                </a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Fecha</th>
                                <th>Trabajador</th>
                                <th>Entrada</th>
                                <th>Salida</th>
                                <th>Horas</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${asistencias}">
                                <td class="ps-4 fw-bold" th:text="${a.fecha}"></td>
                                <td th:text="${a.trabajador.nombre}"></td>
                                <td th:text="${a.horaEntrada}"></td>
                                <td th:text="${a.horaSalida}"></td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${a.horasTotales} + ' hrs'"></span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(asistencias)}">
                                <td colspan="5" class="text-center py-5 text-muted">No se han registrado asistencias aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
