<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Detallado - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/asistencias">
                <i class="bi bi-arrow-left-circle me-2"></i> Panameño Garcia
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Sidebar: Información del Trabajador -->
            <div class="col-lg-3">
                <div class="card shadow-sm border-0 mb-4 text-center p-4">
                    <i class="bi bi-person-circle text-primary mb-3" style="font-size: 3.5rem;"></i>
                    <h4 class="fw-bold text-dark" th:text="${trabajador.nombre}"></h4>
                    <p class="text-muted small mb-3" th:text="${trabajador.puesto}"></p>
                    <div class="badge bg-light text-dark border w-100 mb-3 p-2">
                        DUI: <span th:text="${trabajador.dui}"></span>
                    </div>
                    <div class="bg-primary text-white rounded-3 p-3 shadow-sm">
                        <div class="small opacity-75">Total Base Histórico</div>
                        <div class="h2 fw-bold mb-0" th:text="${totalHorasGlobal}">0.00</div>
                    </div>
                </div>
            </div>

            <!-- Listado Principal Agrupado por Mes -->
            <div class="col-lg-9">
                <div th:if="${success}" class="alert alert-success shadow-sm mb-4" th:text="${success}"></div>

                <h3 class="fw-bold text-dark mb-4"><i class="bi bi-calendar-range me-2"></i>Historial de Jornadas</h3>

                <div th:each="entrada : ${jornadasPorMes}" class="mb-5">
                    <div class="d-flex align-items-center mb-3">
                        <span class="badge bg-dark px-4 py-2 rounded-pill shadow-sm" th:text="${entrada.key}">MES</span>
                        <div class="flex-grow-1 border-bottom ms-3" style="border-width: 2px !important;"></div>
                    </div>

                    <div class="card shadow-sm border-0 overflow-hidden">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4" style="width: 20%;">Fecha</th>
                                    <th>Jornada Base</th>
                                    <th>Horas Extra</th>
                                    <th class="text-end pe-4">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="h : ${entrada.value}">
                                    <td class="ps-4 fw-bold text-dark" th:text="${#temporals.format(h.fecha, 'dd/MM/yyyy')}"></td>
                                    <td>
                                        <i class="bi bi-clock text-muted me-1"></i>
                                        <span th:text="${h.horaEntrada} + ' - ' + ${h.horaSalida}"></span>
                                        <span class="badge bg-secondary-subtle text-secondary border border-secondary ms-1" th:text="${h.horasTotales} + 'h'"></span>
                                    </td>
                                    <td>
                                        <!-- Apartado de Horas Extra con Icono de Información -->
                                        <div th:if="${h.totalHorasExtra > 0}" class="d-flex align-items-center">
                                            <span class="text-success fw-bold me-2" 
                                                  th:text="'+' + ${#numbers.formatDecimal(h.totalHorasExtra, 1, 2)} + 'h'"></span>
                                            
                                            <!-- Icono de información con el motivo en el atributo title (tooltip) -->
                                            <i class="bi bi-info-circle text-muted" 
                                               style="cursor: help;"
                                               th:title="${#strings.listJoin(h.horasExtras.![motivo], ' | ')}"></i>
                                        </div>
                                            <span th:unless="${h.totalHorasExtra > 0}" class="text-muted small opacity-50">--</span>
                                    </td>
                                    <td class="text-end pe-4">
                                        <button class="btn btn-sm btn-outline-success rounded-pill px-3" 
                                                data-bs-toggle="modal" 
                                                th:data-bs-target="'#modalExtra' + ${h.id}">
                                            <i class="bi bi-plus-lg"></i> Extra
                                        </button>

                                        <!-- Modal para registrar Horas Extra -->
                                        <div class="modal fade text-start" th:id="'modalExtra' + ${h.id}" tabindex="-1">
                                            <div class="modal-dialog modal-dialog-centered">
                                                <div class="modal-content border-0 shadow-lg">
                                                    <form th:action="@{/asistencias/horas-extra/guardar}" method="post">
                                                        <input type="hidden" name="asistencia.id" th:value="${h.id}">
                                                        <div class="modal-header bg-success text-white border-0">
                                                            <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Reportar Horas Extra</h5>
                                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                                        </div>
                                                        <div class="modal-body p-4">
                                                            <p class="text-muted mb-4">Registro para la fecha: <strong th:text="${#temporals.format(h.fecha, 'dd/MM/yyyy')}"></strong></p>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-bold">Cantidad de Horas</label>
                                                                <input type="number" step="0.5" name="cantidad" class="form-control form-control-lg" placeholder="0.0" required>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label class="form-label fw-bold">Tipo de Recargo</label>
                                                                <select name="tipo" class="form-select" required>
                                                                    <option value="DIURNA">Diurna (100% recargo)</option>
                                                                    <option value="NOCTURNA">Nocturna (125% recargo)</option>
                                                                </select>
                                                            </div>
                                                            <div class="mb-1">
                                                                <label class="form-label fw-bold">Motivo o Tarea Realizada</label>
                                                                <textarea name="motivo" class="form-control" rows="2" placeholder="Describa la razón del tiempo extra..." required></textarea>
                                                            </div>
                                                        </div>
                                                        <div class="modal-footer bg-light border-0">
                                                            <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cerrar</button>
                                                            <button type="submit" class="btn btn-success px-4 rounded-pill">Guardar Registro</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                            <!-- Footer de la tabla con sumatorias paralelas -->
                            <tfoot class="table-group-divider bg-light bg-opacity-50">
                                <tr>
                                    <td colspan="1" class="text-end fw-bold py-3 ps-4 text-muted">RESUMEN MENSUAL:</td>
                                    <td class="py-3">
                                        <div class="small text-muted">Horas Base:</div>
                                        <div class="h5 fw-bold text-dark mb-0" 
                                             th:with="sumaBase=${#aggregates.sum(entrada.value.![horasTotales])}">
                                            <span th:text="${#numbers.formatDecimal(sumaBase, 1, 2)}">0.00</span> <small>hrs</small>
                                        </div>
                                    </td>
                                    <td class="py-3" colspan="2">
                                        <div class="small text-muted text-success">Horas Extra:</div>
                                        <div class="h5 fw-bold text-success mb-0" 
                                             th:with="sumaExtra=${#aggregates.sum(entrada.value.![totalHorasExtra])}">
                                            +<span th:text="${#numbers.formatDecimal(sumaExtra, 1, 2)}">0.00</span> <small>hrs</small>
                                        </div>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
