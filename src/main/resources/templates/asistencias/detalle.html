<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Historial Detallado')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('asistencias')}"></aside>

    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Control de Jornadas')}"></header>

        <main class="content-body">
            <div class="row">
                <!-- SIDEBAR: FICHA TÉCNICA -->
                <div class="col-lg-3">
                    <div class="card shadow-sm border-0 rounded-4 text-center p-4 mb-4 bg-white sticky-top" style="top: 90px;">
                        <div class="mb-3">
                            <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                                <i class="bi bi-person-vcard text-primary fs-1"></i>
                            </div>
                        </div>
                        <h5 class="fw-bold text-dark mb-1" th:text="${trabajador.nombre}"></h5>
                        <p class="text-primary small fw-bold text-uppercase mb-3" th:text="${trabajador.puesto}"></p>
                        <div class="bg-light border rounded-3 p-2 mb-4 small fw-bold">DUI: <span th:text="${trabajador.dui}"></span></div>
                        
                        <div class="text-start">
                            <h6 class="text-muted text-uppercase small fw-bold mb-3 border-bottom pb-2">Acumulado Aprobado</h6>
                            <div class="stat-box bg-primary text-white shadow-sm mb-2"><small class="opacity-75">Base</small><h4 class="mb-0 fw-bold" th:text="${totalBaseGlobal}"></h4></div>
                            <div class="stat-box bg-success text-white shadow-sm mb-2"><small class="opacity-75">Diurnas</small><h4 class="mb-0 fw-bold" th:text="${totalDiurnaGlobal}"></h4></div>
                            <div class="stat-box bg-dark text-white shadow-sm"><small class="opacity-75">Nocturnas</small><h4 class="mb-0 fw-bold" th:text="${totalNocturnaGlobal}"></h4></div>
                        </div>
                    </div>
                </div>

                <!-- LISTADO POR MESES -->
                <div class="col-lg-9">
                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:each="entrada : ${jornadasPorMes}" class="mb-5">
                        <div class="d-flex align-items-center mb-3">
                            <span class="badge bg-dark px-4 py-2 rounded-pill shadow-sm fw-bold" th:text="${entrada.key}"></span>
                            <div class="flex-grow-1 border-bottom ms-3" style="border-width: 2px !important;"></div>
                        </div>

                        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th class="ps-4">Fecha</th>
                                            <th>Estado</th>
                                            <th>Base</th>
                                            <th>Diurnas</th>
                                            <th>Nocturnas</th>
                                            <th class="text-end pe-4">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="h : ${entrada.value}">
                                            <td class="ps-4 fw-bold text-dark" th:text="${#temporals.format(h.fecha, 'dd/MM/yyyy')}"></td>
                                            <td>
                                                <span th:if="${h.estado == 'APROBADO'}" class="badge bg-success">Aprobado</span>
                                                <span th:if="${h.estado == 'RECHAZADO'}" class="badge bg-danger" th:title="${h.observacionesJefe}">Rechazado</span>
                                                <span th:if="${h.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendiente</span>
                                            </td>
                                            <td th:text="${h.horasTotales} + 'h'"></td>
                                            <td>
                                                <div th:if="${h.horasDiurnasTotales > 0}">
                                                    <span class="text-success fw-bold" th:text="'+' + ${#numbers.formatDecimal(h.horasDiurnasTotales, 1, 2)} + 'h'"></span>
                                                    <i class="bi bi-info-circle text-muted ms-1" style="cursor:help" th:title="${#strings.listJoin(h.horasExtras.?[tipo == 'DIURNA'].![motivo], ' | ')}"></i>
                                                </div>
                                            </td>
                                            <td>
                                                <div th:if="${h.horasNocturnasTotales > 0}">
                                                    <span class="text-dark fw-bold" th:text="'+' + ${#numbers.formatDecimal(h.horasNocturnasTotales, 1, 2)} + 'h'"></span>
                                                    <i class="bi bi-info-circle text-muted ms-1" style="cursor:help" th:title="${#strings.listJoin(h.horasExtras.?[tipo == 'NOCTURNA'].![motivo], ' | ')}"></i>
                                                </div>
                                            </td>
                                            <td class="text-end pe-4">
                                                <div class="btn-group shadow-sm" th:if="${h.estado == 'PENDIENTE'}">
                                                    <button sec:authorize="hasAnyRole('ADMINISTRADOR','JEFE')" class="btn btn-sm btn-dark px-3 rounded-pill me-1" data-bs-toggle="modal" th:data-bs-target="'#modalRevision' + ${h.id}">Validar</button>
                                                    <button sec:authorize="hasAnyRole('ADMINISTRADOR','SUPERVISOR')" class="btn btn-sm btn-outline-success px-3 rounded-pill" data-bs-toggle="modal" th:data-bs-target="'#modalExtra' + ${h.id}">+ Extra</button>
                                                </div>
                                                <span th:unless="${h.estado == 'PENDIENTE'}" class="text-muted small">Validado</span>

                                                <!-- MODAL REVISIÓN -->
                                                <div class="modal fade text-start" th:id="'modalRevision' + ${h.id}" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow"><form th:action="@{/asistencias/revisar}" method="post"><input type="hidden" name="id" th:value="${h.id}"><div class="modal-header bg-dark text-white border-0"><h5 class="modal-title fw-bold">Validar Registro</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div class="mb-3"><label class="form-label fw-bold">Observaciones</label><textarea name="observaciones" class="form-control" rows="2"></textarea></div><div class="d-grid gap-2"><button type="submit" name="accion" value="APROBAR" class="btn btn-success fw-bold">Aprobar</button><button type="submit" name="accion" value="RECHAZAR" class="btn btn-outline-danger fw-bold">Rechazar</button></div></div></form></div></div></div>
                                                <!-- MODAL EXTRA -->
                                                <div class="modal fade text-start" th:id="'modalExtra' + ${h.id}" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg"><form th:action="@{/asistencias/horas-extra/guardar}" method="post"><input type="hidden" name="asistencia.id" th:value="${h.id}"><div class="modal-header bg-success text-white border-0"><h5 class="modal-title fw-bold">Nueva Hora Extra</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-4"><div class="mb-3"><label class="form-label fw-bold">Cantidad</label><input type="number" step="0.5" name="cantidad" class="form-control" required></div><div class="mb-3"><label class="form-label fw-bold">Tipo</label><select name="tipo" class="form-select"><option value="DIURNA">Diurna</option><option value="NOCTURNA">Nocturna</option></select></div><div class="mb-1"><label class="form-label fw-bold">Motivo</label><textarea name="motivo" class="form-control" rows="2" required></textarea></div></div><div class="modal-footer border-0 bg-light"><button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">Guardar Registro</button></div></form></div></div></div>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <!-- FOOTER: SUMATORIAS APROBADAS Y RECHAZADAS -->
                                    <tfoot class="table-group-divider bg-light bg-opacity-50">
                                        <!-- Fila Aprobados -->
                                        <tr class="fw-bold">
                                            <td colspan="2" class="text-end py-3 ps-4 text-muted small">SUBTOTALES APROBADOS:</td>
                                            <td class="py-3 text-primary"><span th:text="${#numbers.formatDecimal(#aggregates.sum(entrada.value.![horasBaseSiAprobado]), 1, 2)}">0.00</span></td>
                                            <td class="py-3 text-success">+<span th:text="${#numbers.formatDecimal(#aggregates.sum(entrada.value.![horasDiurnasAprobadas]), 1, 2)}">0.00</span></td>
                                            <td class="py-3 text-dark">+<span th:text="${#numbers.formatDecimal(#aggregates.sum(entrada.value.![horasNocturnasAprobadas]), 1, 2)}">0.00</span></td>
                                            <td></td>
                                        </tr>
                                        <!-- Fila Rechazados (Nueva) -->
                                        <tr class="fw-bold border-top border-danger border-opacity-10">
                                            <td colspan="2" class="text-end py-2 ps-4 text-danger small opacity-75">TOTAL RECHAZADO (BASE + EXTRA):</td>
                                            <td class="py-2 text-danger opacity-75" colspan="3">
                                                <span th:with="baseRec=${#aggregates.sum(entrada.value.![horasBaseSiRechazado])}, extraRec=${#aggregates.sum(entrada.value.![horasExtraSiRechazado])}">
                                                    <span th:text="${#numbers.formatDecimal(baseRec + extraRec, 1, 2)}">0.00</span> hrs perdidas
                                                </span>
                                            </td>
                                            <td></td>
                                        </tr>
                                    </tfoot>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
