<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-building"></i> Panameño Garcia
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <span class="nav-link text-light me-3">
                            <i class="bi bi-person-circle"></i> 
                            <span th:text="${#authentication.name}">Usuario</span>
                        </span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-box-arrow-right"></i> Salir
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="p-5 mb-4 bg-white rounded-4 shadow-sm border-0">
            <div class="container-fluid py-2">
                <h1 class="display-5 fw-bold text-dark">Panel de Control</h1>
                <p class="col-md-8 fs-5 text-muted">Bienvenido al sistema de gestión administrativa y operativa.</p>
                <hr class="my-4">
                
                <div class="row g-4">
                    <!-- ADMINISTRADOR: Gestión de Usuarios -->
                    <div class="col-md-4" sec:authorize="hasRole('ADMINISTRADOR')">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="card-body text-center">
                                <div class="display-4 text-primary mb-3"><i class="bi bi-people-fill"></i></div>
                                <h5 class="card-title fw-bold">Usuarios</h5>
                                <p class="card-text text-muted">Control de accesos y roles del sistema.</p>
                                <a href="/usuarios" class="btn btn-primary px-4 rounded-pill">Gestionar</a>
                            </div>
                        </div>
                    </div>

                    <!-- SUPERVISOR / ADMIN: Trabajadores -->
                    <div class="col-md-4" sec:authorize="hasAnyRole('ADMINISTRADOR','SUPERVISOR')">
                        <div class="card h-100 border-0 shadow-sm">
                            <div class="card-body text-center">
                                <div class="display-4 text-success mb-3"><i class="bi bi-person-badge-fill"></i></div>
                                <h5 class="card-title fw-bold">Trabajadores</h5>
                                <p class="card-text text-muted">Registro y edición de datos del personal.</p>
                                <a href="/trabajadores" class="btn btn-success px-4 rounded-pill">Gestionar</a>
                            </div>
                        </div>
                    </div>

                    <!-- PRÓXIMAMENTE: Planillas y Otros -->
                    <div class="col-md-4">
                        <div class="card h-100 border-0 shadow-sm bg-light">
                            <div class="card-body text-center opacity-75">
                                <div class="display-4 text-secondary mb-3"><i class="bi bi-calculator"></i></div>
                                <h5 class="card-title fw-bold">Planillas</h5>
                                <p class="card-text text-muted">Módulo de pagos y asistencias.</p>
                                <button class="btn btn-secondary px-4 rounded-pill disabled">Próximamente</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
