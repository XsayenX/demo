<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-building"></i> Panameño Garcia
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="p-5 mb-4 bg-white rounded-4 shadow-sm">
            <h1 class="display-5 fw-bold">Panel de Gestión</h1>
            <p class="fs-5 text-muted">Bienvenido, <span sec:authentication="name">Usuario</span>.</p>
            <hr>
            
            <div class="row g-4">
                <div class="col-md-4" sec:authorize="hasRole('ADMINISTRADOR')">
                    <div class="card h-100 border-0 shadow-sm text-center">
                        <div class="card-body">
                            <i class="bi bi-people-fill display-4 text-primary"></i>
                            <h5 class="card-title mt-3">Usuarios</h5>
                            <a href="/usuarios" class="btn btn-primary rounded-pill">Entrar</a>
                        </div>
                    </div>
                </div>

                <div class="col-md-4" sec:authorize="hasAnyRole('ADMINISTRADOR','SUPERVISOR')">
                    <div class="card h-100 border-0 shadow-sm text-center">
                        <div class="card-body">
                            <i class="bi bi-person-badge-fill display-4 text-success"></i>
                            <h5 class="card-title mt-3">Trabajadores</h5>
                            <a href="/trabajadores" class="btn btn-success rounded-pill">Entrar</a>
                        </div>
                    </div>
                </div>

                <!-- ACTIVADO: Gestión de Asistencias (Planillas) -->
                <div class="col-md-4" sec:authorize="hasAnyRole('ADMINISTRADOR','SUPERVISOR','CONTADORA')">
                    <div class="card h-100 border-0 shadow-sm text-center">
                        <div class="card-body">
                            <i class="bi bi-calendar-check display-4 text-info"></i>
                            <h5 class="card-title mt-3">Gestión de Asistencias</h5>
                            <a href="/asistencias" class="btn btn-info rounded-pill">Entrar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
