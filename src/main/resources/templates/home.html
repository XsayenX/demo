<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('home')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Panel de Control')}"></header>
        <main class="content-body">
            <div class="container-fluid">
                <div class="row g-4">
                    <div class="col-12">
                        <div class="card p-5 bg-white border-0 shadow-sm text-center">
                            <div class="mb-4">
                                <i class="bi bi-person-check-fill text-primary" style="font-size: 4rem;"></i>
                            </div>
                            <h1 class="display-6 fw-bold">Bienvenido, <span th:text="${#authentication.name}"></span></h1>
                            <p class="text-muted lead">Sistema de Gestión Administrativa - Constructora Panameño Garcia.</p>
                            <div class="d-flex justify-content-center gap-2 mt-2">
                                <span class="badge bg-light text-dark border px-3 py-2">
                                    <i class="bi bi-calendar3 me-2"></i><span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
