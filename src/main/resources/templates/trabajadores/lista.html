<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trabajadores')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('trabajadores')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Lista de Personal')}"></header>
        <main class="content-body">
            
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}"></div>

            <!-- CONTROLES SUPERIORES Y BUSCADOR -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <form action="/trabajadores" method="get" class="flex-grow-1" style="max-width: 500px;">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border">
                        <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" name="q" th:value="${q}" class="form-control border-0 bg-white shadow-none" placeholder="Buscar por nombre o DUI...">
                        <a th:if="${q != null and q != ''}" href="/trabajadores" class="btn btn-white border-0 text-danger d-flex align-items-center" title="Limpiar búsqueda"><i class="bi bi-x-circle-fill"></i></a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">Buscar</button>
                    </div>
                </form>

                <div class="d-flex gap-2">
                    <a href="/trabajadores/puestos" class="btn btn-outline-dark rounded-pill px-4 fw-bold shadow-sm"><i class="bi bi-gear me-2"></i>Cargos</a>
                    <button class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCrearTrabajador">
                        <i class="bi bi-person-plus-fill me-2"></i>Registrar Trabajador
                    </button>
                </div>
            </div>
            
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Nombre</th>
                                <th>DUI</th>
                                <th>Puesto Actual</th>
                                <th>Estado</th>
                                <th class="text-center pe-4">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${trabajadores}">
                                <td class="ps-4 fw-bold text-dark" th:text="${t.nombre}"></td>
                                <td th:text="${t.dui}" class="text-muted small"></td>
                                <td>
                                    <span class="badge bg-secondary-subtle text-secondary border border-secondary" th:text="${t.puesto != null ? t.puesto.nombre : 'Sin Puesto'}"></span>
                                </td>
                                <td>
                                    <span th:if="${t.activo}" class="badge bg-success-subtle text-success">Activo</span>
                                    <span th:unless="${t.activo}" class="badge bg-danger-subtle text-danger">Inactivo</span>
                                </td>
                                <td class="text-center pe-4">
                                    <button class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" data-bs-toggle="modal" th:data-bs-target="'#modalEditarTrabajador-' + ${t.id}">
                                        Editar
                                    </button>

                                    <!-- Modal Editar Trabajador -->
                                    <div class="modal fade text-start" th:id="'modalEditarTrabajador-' + ${t.id}" tabindex="-1">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content border-0 shadow">
                                                <form th:action="@{/trabajadores/guardar}" method="post">
                                                    <input type="hidden" name="id" th:value="${t.id}">
                                                    <div class="modal-header bg-warning border-0">
                                                        <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Ficha de Personal</h5>
                                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                    </div>
                                                    <div class="modal-body p-4">
                                                        <div class="mb-3">
                                                            <label class="form-label fw-bold small text-muted">Nombre Completo</label>
                                                            <input type="text" name="nombre" class="form-control bg-light border-0 fw-bold" th:value="${t.nombre}" required>
                                                        </div>
                                                        <div class="row g-3 mb-3">
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">DUI (Fijo)</label>
                                                                <input type="text" name="dui" class="form-control bg-white border-0" th:value="${t.dui}" readonly>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">NSS</label>
                                                                <input type="text" name="nss" class="form-control bg-light border-0" th:value="${t.nss}" required>
                                                            </div>
                                                        </div>
                                                        <div class="row g-3 mb-3">
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">Fecha Ingreso</label>
                                                                <input type="date" name="fechaIngreso" class="form-control bg-light border-0" th:value="${t.fechaIngreso}" required>
                                                            </div>
                                                            <div class="col-md-6">
                                                                <label class="form-label fw-bold small text-muted">Cargo / Puesto</label>
                                                                <select name="puesto.id" class="form-select bg-light border-0" required>
                                                                    <option th:each="p : ${puestos}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${t.puesto != null and t.puesto.id == p.id}"></option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="form-check form-switch mt-3 border-top pt-3">
                                                            <input class="form-check-input" type="checkbox" name="activo" th:checked="${t.activo}" th:id="'activoTrab-' + ${t.id}">
                                                            <input type="hidden" name="_activo" value="on">
                                                            <label class="form-check-label fw-bold text-primary" th:for="'activoTrab-' + ${t.id}">Empleado Activo (Planillas)</label>
                                                        </div>
                                                    </div>
                                                    <div class="modal-footer border-0 bg-light">
                                                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Actualizar Ficha</button>
                                                    </div>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(trabajadores)}">
                                <td colspan="5" class="text-center py-5 text-muted"><i class="bi bi-search display-6 d-block mb-2"></i>No se encontraron resultados para "<span th:text="${q}"></span>"</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modal Crear Trabajador -->
            <div class="modal fade" id="modalCrearTrabajador" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content border-0 shadow">
                        <form th:action="@{/trabajadores/guardar}" th:object="${nuevoTrabajador}" method="post">
                            <div class="modal-header bg-success text-white border-0">
                                <h5 class="modal-title fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Registrar Trabajador</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body p-4">
                                <div class="mb-3">
                                    <label class="form-label fw-bold small text-muted">Nombre Completo</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0" required>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">DUI (00000000-0)</label>
                                        <!-- AQUÍ AGREGAMOS LA CLASE 'dui-format' Y EL MAXLENGTH="10" -->
                                        <input type="text" th:field="*{dui}" class="form-control bg-light border-0 dui-format" placeholder="00000000-0" required pattern="\d{8}-\d" maxlength="10">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">NSS</label>
                                        <input type="text" th:field="*{nss}" class="form-control bg-light border-0" required>
                                    </div>
                                </div>
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Fecha Ingreso</label>
                                        <input type="date" th:field="*{fechaIngreso}" class="form-control bg-light border-0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Puesto de Trabajo</label>
                                        <select th:field="*{puesto.id}" class="form-select bg-light border-0" required>
                                            <option value="">-- Seleccione --</option>
                                            <option th:each="p : ${puestos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-0 bg-light">
                                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
    
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- SCRIPT PARA EL AUTO-FORMATO DEL DUI -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const duiInputs = document.querySelectorAll('.dui-format');
            
            duiInputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    // 1. Eliminar cualquier caracter que no sea número
                    let value = e.target.value.replace(/\D/g, '');
                    
                    // 2. Limitar a un máximo estricto de 9 números
                    if (value.length > 9) {
                        value = value.slice(0, 9);
                    }
                    
                    // 3. Insertar el guion automáticamente después del 8vo número
                    if (value.length > 8) {
                        value = value.slice(0, 8) + '-' + value.slice(8);
                    }
                    
                    // 4. Actualizar el valor en el input en tiempo real
                    e.target.value = value;
                });
            });
        });
    </script>
</body>
</html>
