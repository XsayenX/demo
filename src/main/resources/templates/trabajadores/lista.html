<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Trabajadores')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('trabajadores')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Lista de Personal')}"></header>
        <main class="content-body">
            <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4"><form th:action="@{/trabajadores}" method="get" class="row g-2"><div class="col-md-10"><input type="text" name="q" th:value="${q}" class="form-control bg-light border-0 rounded-pill px-4" placeholder="Buscar trabajador por nombre o DUI..."></div><div class="col-md-2"><button class="btn btn-dark w-100 rounded-pill fw-bold" type="submit">Filtrar</button></div></form></div></div>
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-header bg-white py-4 px-4 d-flex justify-content-between align-items-center"><h5 class="mb-0 fw-bold">Personal Registrado</h5><a th:href="@{/trabajadores/nuevo}" class="btn btn-success rounded-pill px-4 fw-bold">Registrar Nuevo</a></div>
                <div class="card-body p-0"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th class="ps-4">Nombre</th><th>DUI</th><th>Puesto</th><th class="text-center">Acciones</th></tr></thead><tbody><tr th:each="t : ${trabajadores}"><td class="ps-4 fw-bold" th:text="${t.nombre}"></td><td th:text="${t.dui}" class="text-muted small fw-bold"></td><td th:text="${t.puesto}"></td><td class="text-center"><a th:href="@{/trabajadores/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">Editar Ficha</a></td></tr></tbody></table></div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
