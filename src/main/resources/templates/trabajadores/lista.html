<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Panameño Garcia</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h3 class="mb-0 fw-bold"><i class="bi bi-people"></i> Listado de Personal</h3>
                <a th:href="@{/trabajadores/nuevo}" class="btn btn-success rounded-pill">
                    <i class="bi bi-plus-lg"></i> Registrar Nuevo
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Nombre</th>
                                <th>DUI</th>
                                <th>Puesto</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${trabajadores}">
                                <td th:text="${t.nombre}" class="fw-bold"></td>
                                <td th:text="${t.dui}"></td>
                                <td th:text="${t.puesto}"></td>
                                <td>
                                    <span th:if="${t.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${t.activo}" class="badge bg-danger">Inactivo</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/trabajadores/editar/{id}(id=${t.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(trabajadores)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    No hay trabajadores registrados en el sistema.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
