<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar Trabajador')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('trabajadores')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Modificar Ficha de Personal')}"></header>
        <main class="content-body">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm overflow-hidden">
                        <div class="card-header bg-warning py-3 px-4 border-0">
                            <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Actualizar Datos</h5>
                        </div>
                        <div class="card-body p-5">
                            <form th:action="@{/trabajadores/guardar}" th:object="${trabajador}" method="post">
                                <input type="hidden" th:field="*{id}">
                                
                                <div class="mb-4">
                                    <label class="form-label fw-bold small text-muted">Nombre Completo</label>
                                    <input type="text" th:field="*{nombre}" class="form-control bg-light border-0 py-2 fw-bold" required>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">DUI (No modificable)</label>
                                        <input type="text" th:field="*{dui}" class="form-control bg-white border-0 py-2" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">NSS (Seguro Social)</label>
                                        <input type="text" th:field="*{nss}" class="form-control bg-light border-0 py-2" required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Puesto / Cargo</label>
                                        <input type="text" th:field="*{puesto}" class="form-control bg-light border-0 py-2" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Estado en Planilla</label>
                                        <div class="form-check form-switch mt-2">
                                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="trabActivo">
                                            <label class="form-check-label fw-bold text-primary" for="trabActivo">Trabajador Activo</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 border-top pt-4">
                                    <a href="/trabajadores" class="btn btn-light rounded-pill px-4">Cancelar</a>
                                    <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">Actualizar Ficha</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
