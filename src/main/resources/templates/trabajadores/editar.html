<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Trabajador - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Panameño Garcia</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-warning py-3">
                        <h3 class="mb-0 fw-bold text-dark"><i class="bi bi-pencil-square"></i> Editar Información del Personal</h3>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/trabajadores/guardar}" th:object="${trabajador}" method="post">
                            <!-- ID oculto para edición -->
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-4">
                                <label class="form-label fw-bold">Nombre Completo</label>
                                <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold">DUI</label>
                                    <input type="text" th:field="*{dui}" class="form-control bg-light" readonly>
                                    <small class="text-muted">El DUI no puede ser modificado por seguridad.</small>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold">NSS (Seguro Social)</label>
                                    <input type="text" th:field="*{nss}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{nss}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold">Fecha de Ingreso</label>
                                    <input type="date" th:field="*{fechaIngreso}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold">Puesto / Cargo</label>
                                    <input type="text" th:field="*{puesto}" class="form-control" th:errorclass="is-invalid">
                                    <div class="invalid-feedback" th:errors="*{puesto}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{activo}" id="checkActivo">
                                    <label class="form-check-label fw-bold" for="checkActivo">Trabajador en activo</label>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/trabajadores" class="btn btn-outline-secondary px-4">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4">Actualizar Información</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
