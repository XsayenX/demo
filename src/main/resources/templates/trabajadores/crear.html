<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Trabajador - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Constructora Panameño Garcia</a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Nuevo Trabajador</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/trabajadores/guardar}" th:object="${trabajador}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">DUI</label>
                            <input type="text" th:field="*{dui}" class="form-control" placeholder="00000000-0" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{dui}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">NSS (Seguro Social)</label>
                            <input type="text" th:field="*{nss}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{nss}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Ingreso</label>
                            <input type="date" th:field="*{fechaIngreso}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Puesto / Cargo</label>
                            <input type="text" th:field="*{puesto}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{puesto}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="/trabajadores" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Registrar Trabajador</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
