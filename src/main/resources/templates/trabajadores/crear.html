<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Trabajador')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('trabajadores')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Registrar Trabajador')}"></header>
        <main class="content-body">
            <div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body p-4">
                <form th:action="@{/trabajadores/guardar}" th:object="${trabajador}" method="post">
                    <div class="mb-3"><label class="form-label fw-bold">Nombre Completo</label><input type="text" th:field="*{nombre}" class="form-control" required></div>
                    <div class="row mb-3"><div class="col-md-6"><label class="form-label fw-bold">DUI</label><input type="text" th:field="*{dui}" class="form-control" placeholder="00000000-0" required></div><div class="col-md-6"><label class="form-label fw-bold">NSS</label><input type="text" th:field="*{nss}" class="form-control" required></div></div>
                    <div class="row mb-4"><div class="col-md-6"><label class="form-label fw-bold">Fecha Ingreso</label><input type="date" th:field="*{fechaIngreso}" class="form-control" required></div><div class="col-md-6"><label class="form-label fw-bold">Puesto</label><input type="text" th:field="*{puesto}" class="form-control" required></div></div>
                    <div class="text-end"><a href="/trabajadores" class="btn btn-light rounded-pill">Cancelar</a><button type="submit" class="btn btn-success rounded-pill px-4 fw-bold">Guardar</button></div>
                </form>
            </div></div></div></div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
