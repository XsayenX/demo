<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios - Panameño Garcia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/usuarios">Constructora Panameño Garcia</a>
            <div class="navbar-nav ms-auto">
                <span class="nav-item nav-link text-light me-3">
                    Hola, <strong th:text="${#authentication.name}">Usuario</strong> 
                    (<span sec:authentication="principal.authorities">Roles</span>)
                </span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Gestión de Usuarios</h3>
                <!-- Solo Admin puede ver el botón de registrar -->
                <a sec:authorize="hasRole('ADMINISTRADOR')" th:href="@{/usuarios/nuevo}" class="btn btn-primary">Registrar Usuario</a>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Username</th>
                            <th>Nombre Completo</th>
                            <th>Email</th>
                            <th>Roles</th>
                            <th>Estado</th>
                            <!-- Solo Admin puede ver la columna de acciones -->
                            <th sec:authorize="hasRole('ADMINISTRADOR')">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.username}" class="fw-bold"></td>
                            <td th:text="${u.nombreCompleto}"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                                <span th:each="rol : ${u.roles}" class="badge bg-info text-dark me-1" th:text="${rol.nombre}"></span>
                            </td>
                            <td>
                                <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                                <span th:unless="${u.activo}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td sec:authorize="hasRole('ADMINISTRADOR')">
                                <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-warning">Editar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
