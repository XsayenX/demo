<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Gestión de Usuarios')}"></header>
        <main class="content-body">
            <div th:if="${success}" class="alert alert-success border-0 shadow-sm mb-4" th:text="${success}"></div>
            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-header bg-white py-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-shield-lock me-2 text-primary"></i>Cuentas del Sistema</h5>
                    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary rounded-pill px-4 fw-bold">Nuevo Usuario</a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light"><tr><th class="ps-4">Username</th><th>Nombre</th><th>Roles</th><th>Estado</th><th class="text-center pe-4">Acciones</th></tr></thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td class="ps-4 fw-bold" th:text="${u.username}"></td><td th:text="${u.nombreCompleto}"></td>
                                <td><span th:each="rol : ${u.roles}" class="badge bg-info-subtle text-info border border-info me-1" th:text="${rol.nombre}"></span></td>
                                <td><span th:if="${u.activo}" class="badge bg-success-subtle text-success">Activo</span><span th:unless="${u.activo}" class="badge bg-danger-subtle text-danger">Inactivo</span></td>
                                <td class="text-center pe-4"><a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3">Configurar</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
