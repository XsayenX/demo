<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Usuario')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Crear Nuevo Usuario')}"></header>
        <main class="content-body">
            <div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-5">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <div class="row g-3 mb-4"><div class="col-md-6"><label class="form-label fw-bold small text-muted">Username</label><input type="text" th:field="*{username}" class="form-control bg-light border-0" required></div><div class="col-md-6"><label class="form-label fw-bold small text-muted">Email</label><input type="email" th:field="*{email}" class="form-control bg-light border-0" required></div></div>
                    <div class="mb-4"><label class="form-label fw-bold small text-muted">Nombre Completo</label><input type="text" th:field="*{nombreCompleto}" class="form-control bg-light border-0" required></div>
                    <div class="row g-3 mb-4"><div class="col-md-6"><label class="form-label fw-bold small text-muted">Contraseña</label><input type="password" th:field="*{password}" class="form-control bg-light border-0" required></div><div class="col-md-6"><label class="form-label fw-bold small text-muted">Roles</label><select th:field="*{roles}" class="form-select bg-light border-0" multiple required size="4"><option th:each="rol : ${allRoles}" th:value="${rol.id}" th:text="${rol.nombre}"></option></select></div></div>
                    <div class="d-flex justify-content-end gap-2"><a href="/usuarios" class="btn btn-light rounded-pill px-4">Cancelar</a><button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Guardar Usuario</button></div>
                </form>
            </div></div></div></div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
