<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar Usuario')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Configuración de Cuenta')}"></header>
        <main class="content-body">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-sm overflow-hidden">
                        <div class="card-header bg-dark py-3 px-4 border-0">
                            <h5 class="mb-0 fw-bold text-white"><i class="bi bi-gear-fill me-2 text-warning"></i>Ajustes de Usuario</h5>
                        </div>
                        <div class="card-body p-5 text-dark">
                            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{password}">

                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">ID de Usuario</label>
                                        <input type="text" th:field="*{username}" class="form-control bg-white border-0 py-2" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold small text-muted">Correo Electrónico</label>
                                        <input type="email" th:field="*{email}" class="form-control bg-light border-0 py-2" required>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold small text-muted">Roles y Permisos</label>
                                    <select th:field="*{roles}" class="form-select bg-light border-0" multiple required size="4">
                                        <option th:each="rol : ${allRoles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                                    </select>
                                    <small class="text-muted mt-2 d-block">Ctrl + Click para selección múltiple.</small>
                                </div>

                                <div class="mb-5">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" th:field="*{activo}" id="userActivo">
                                        <label class="form-check-label fw-bold" for="userActivo">Habilitar acceso al sistema</label>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 border-top pt-4">
                                    <a href="/usuarios" class="btn btn-light rounded-pill px-4">Volver</a>
                                    <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm">Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
