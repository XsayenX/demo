<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Planilla Generada')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('asistencias')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Resumen de Pago')}"></header>
        <main class="content-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0 text-dark">Planilla del <span th:text="${#temporals.format(fInicio, 'dd/MM')}"></span> al <span th:text="${#temporals.format(fFin, 'dd/MM/yyyy')}"></span></h4>
                <button onclick="window.print()" class="btn btn-dark rounded-pill px-4"><i class="bi bi-printer me-2"></i>Imprimir Reporte</button>
            </div>

            <div class="card border-0 shadow-sm overflow-hidden">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4">Trabajador</th>
                                <th>DUI</th>
                                <th>H. Base</th>
                                <th>Extra Diurna</th>
                                <th>Extra Nocturna</th>
                                <th class="pe-4 text-end">Total Horas</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${resumen}">
                                <td class="ps-4">
                                    <strong th:text="${r.trabajador.nombre}"></strong>
                                    <small class="d-block text-muted" th:text="${r.trabajador.puesto.nombre}"></small>
                                </td>
                                <td th:text="${r.trabajador.dui}" class="small font-monospace"></td>
                                <td th:text="${#numbers.formatDecimal(r.totalHorasBase, 1, 2)}"></td>
                                <td class="text-success" th:text="'+' + ${#numbers.formatDecimal(r.totalExtrasDiurnas, 1, 2)}"></td>
                                <td class="text-dark" th:text="'+' + ${#numbers.formatDecimal(r.totalExtrasNocturnas, 1, 2)}"></td>
                                <td class="pe-4 text-end fw-bold text-primary">
                                    <span th:text="${#numbers.formatDecimal(r.totalHorasBase + r.totalExtrasDiurnas + r.totalExtrasNocturnas, 1, 2)}"></span> hrs
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(resumen)}">
                                <td colspan="6" class="text-center py-5">No hay jornadas aprobadas en este rango de fechas.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
