<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Generar Planilla')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('asistencias')}"></aside>
    <div id="main-content">
        <header th:replace="~{fragments/layout :: topbar('Cierre de Planilla')}"></header>
        <main class="content-body">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm p-5 text-center">
                        <i class="bi bi-calculator display-1 text-primary mb-4"></i>
                        <h3 class="fw-bold mb-4">Cálculo de Pagos</h3>
                        <form th:action="@{/planillas/generar}" method="post">
                            <div class="row mb-4">
                                <div class="col text-start">
                                    <label class="form-label fw-bold small">Desde</label>
                                    <input type="date" name="inicio" th:value="${fechaInicio}" class="form-control" required>
                                </div>
                                <div class="col text-start">
                                    <label class="form-label fw-bold small">Hasta</label>
                                    <input type="date" name="fin" th:value="${fechaFin}" class="form-control" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold">Generar Resumen <i class="bi bi-file-earmark-text ms-2"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script th:replace="~{fragments/layout :: script}"></script>
</body>
</html>
